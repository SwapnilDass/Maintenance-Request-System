services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maintenance_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # lets "docker compose up -d --wait" (npm run db:up) wait until postgres is actually ready
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d maintenance_db"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
